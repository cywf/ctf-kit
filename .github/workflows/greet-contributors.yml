name: Greet Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    
    steps:
      - name: Greet first-time contributors on PR
        if: github.event_name == 'pull_request_target'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 Thank you for your contribution to CTF-Kit!
            
            This is your first pull request to our repository. We appreciate you taking the time to contribute!
            
            Our team will review your PR soon. In the meantime:
            - Make sure all tests pass
            - Ensure your code follows our contribution guidelines
            - Feel free to ask questions if you need clarification
            
            Check out our [CONTRIBUTING.md](https://github.com/cywf/ctf-kit/blob/main/CONTRIBUTING.md) for more information.
            
            Happy hacking! 🚀

      - name: Greet first-time contributors on Issue
        if: github.event_name == 'issues'
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thank you for opening your first issue in CTF-Kit!
            
            We appreciate you taking the time to report this. A maintainer will review it soon.
            
            Please make sure you've included:
            - A clear description of the issue or feature request
            - Steps to reproduce (for bugs)
            - Expected vs actual behavior (for bugs)
            
            Feel free to add any additional context that might help us understand and address your issue.
            
            Thanks for helping improve CTF-Kit! 🎯
